<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MMFI - TikTok sign-in result</title><style>body{margin:0;background:#070b1a;color:#e6f0ff;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{max-width:640px;padding:28px}h1{font-size:22px}code,textarea{display:block;width:100%;box-sizing:border-box;background:#0d1430;border:1px solid #1f2b5a;border-radius:10px;color:#22e3ff;padding:12px;font:14px/1.5 Consolas,monospace;word-break:break-all}button{margin-top:10px;background:#22e3ff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}p{color:#8ea0cf}</style></head><body><main><h1>MMFI - TikTok sign-in result</h1><p id="m">Waiting...</p><textarea id="k" rows="4" readonly style="display:none"></textarea><button id="b" style="display:none">Copy</button><p>This page only shows the sign-in result to you. It stores nothing and sends nothing anywhere. Close it after copying.</p></main><script>(function(){var q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error'),m=document.getElementById('m'),k=document.getElementById('k'),b=document.getElementById('b');if(c){m.textContent='Success. Copy this code into the MMFI tool:';k.value=c;k.style.display='block';b.style.display='inline-block';b.onclick=function(){k.select();document.execCommand('copy');b.textContent='Copied'}}else if(e){m.textContent='TikTok returned an error: '+e+' '+(q.get('error_description')||'')}else{m.textContent='No sign-in result in this address. Start the sign-in from the MMFI tool.'}})();</script></body></html>
